<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bell - English Grammar Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f4f6f9; }
    
    /* Sidebar Styling */
    .sidebar { width: 250px; background-color: #1e1e2f; color: #fff; display: flex; flex-direction: column; padding: 20px; }
    .sidebar h2 { font-size: 22px; color: #4e54c8; margin-bottom: 5px; }
    .sidebar p.author { font-size: 12px; color: #aaa; margin-bottom: 25px; }
    .nav-item { padding: 12px 15px; color: #ddd; text-decoration: none; border-radius: 6px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
    .nav-item:hover { background-color: #2a2a40; color: #fff; }

    /* Main Area Styling */
    .main-content { flex: 1; display: flex; flex-direction: column; }
    .header { background: linear-gradient(90deg, #4e54c8, #8f94fb); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    
    .message { max-width: 70%; padding: 12px 18px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
    .bot-message { background-color: #ffffff; color: #333; align-self: flex-start; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .user-message { background-color: #4e54c8; color: white; align-self: flex-end; }
    
    .input-area { padding: 15px 20px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; }
    .input-area input { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    .btn { padding: 12px 20px; border: none; border-radius: 8px; background-color: #4e54c8; color: white; cursor: pointer; font-weight: bold; }
    .btn:hover { background-color: #3b4099; }
    .btn-secondary { background-color: #6c757d; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Bell App</h2>
    <p class="author">Created by Sakthi Raja</p>
    <div class="nav-item">🏠 Home</div>
    <div class="nav-item">📊 Dashboard</div>
    <div class="nav-item">📤 Upload</div>
    <div class="nav-item">🎙️ Voice Input</div>
    <div class="nav-item">📷 Scan</div>
    <div class="nav-item">💾 Save As</div>
    <div class="nav-item">📌 Pin</div>
    <div class="nav-item">✏️ Edit</div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h3>Bell - English Grammar Assistant</h3>
      <small>Powered by AI</small>
    </div>

    <div class="chat-container" id="chatBox">
      <div class="message bot-message">
        வணக்கம்! நான் Bell. உங்கள் ஆங்கில இலக்கணம் தொடர்பான சந்தேகங்களைக் கேட்கலாம். (Created by Sakthi Raja)
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="உங்கள் கேள்வியை இங்கே டைப் செய்யுங்கள்..." onkeypress="handleKeyPress(event)">
      <button class="btn btn-secondary" onclick="triggerVoice()">🎙️</button>
      <button class="btn" onclick="sendMessage()">அனுப்பு</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      // User message
      const userDiv = document.createElement('div');
      userDiv.className = 'message user-message';
      userDiv.innerText = text;
      chatBox.appendChild(userDiv);

      input.value = andclear = '';
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Loading message
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message bot-message';
      loadingDiv.innerText = 'பதிலளிக்கிறது...';
      chatBox.appendChild(loadingDiv);

      try {
        const response = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text })
        });
        const data = await response.json();
        
        if (data.reply) {
          loadingDiv.innerText = data.reply;
        } else {
          loadingDiv.innerText = data.error || 'பிழை ஏற்பட்டுள்ளது.';
        }
      } catch (err) {
        loadingDiv.innerText = 'தொடர்பு கொள்ள முடியவில்லை.';
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function triggerVoice() {
      alert('Voice input feature clicked');
    }
  </script>
</body>
</html>
